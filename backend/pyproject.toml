[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kurukuru"
version = "0.1.0"
description = "Kurukuru — local cloud infrastructure: a single-host cloud platform over QEMU"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Paul Nwokolo" }]
keywords = ["qemu", "virtualization", "vm", "hypervisor", "iaas", "self-hosted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Emulators",
    "Topic :: System :: Systems Administration",
]

# Kept in step with requirements.txt, which still works on its own: the
# requirements file is how the backend is installed for development
# (`pip install -r requirements.txt`), and this list is what `pip install -e .`
# resolves. Both are pinned to the same versions deliberately — two dependency
# sets that drift are worse than one duplicated list.
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "sqlmodel==0.0.24",
    "pydantic-settings==2.9.1",
    "PyYAML==6.0.3",
    "pycdlib==1.20.0",
    "argon2-cffi==23.1.0",
    "psutil==7.2.2",
    "httpx==0.28.1",
    "typer>=0.12,<1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]
# What `tools/build_installer.py` needs and the application does not. Pinned
# like everything else: a freezer is part of the toolchain that produces the
# shipped artefact, so "whatever version was on the build machine" is not a
# property a release should have.
build = ["pyinstaller==6.22.2"]

# The command name lives in exactly two places: here, and CLI_NAME in
# kurukuru/product.py. Renaming the product is those two lines — and, from Phase 16
# on, the state-dir migration that carries an existing install across it.
[project.scripts]
kurukuru = "kurukuru.cli.main:main"

[tool.setuptools.packages.find]
include = ["kurukuru*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Platform markers exist so a run can say what it did *not* cover. A suite that
# silently skips the Windows half on Linux (or vice versa) reads as green when
# it is really partial — `pytest -m posix` and `-m windows` make the gap
# visible, and `--strict-markers` stops a typo from disabling a test quietly.
addopts = "--strict-markers"
markers = [
    "windows: requires a Windows host (Win32 APIs, path separators, ACLs)",
    "posix: requires a POSIX host (signals, sessions, file modes)",
    "posix_logic: POSIX decision logic, exercised anywhere by substituting syscalls",
]
