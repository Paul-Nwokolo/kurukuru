[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-iaas"
version = "0.1.0"
description = "Local IaaS Orchestrator — a single-host cloud platform over QEMU"
readme = "README.md"
requires-python = ">=3.11"

# Kept in step with requirements.txt, which still works on its own: the
# requirements file is how the backend is installed for development
# (`pip install -r requirements.txt`), and this list is what `pip install -e .`
# resolves. Both are pinned to the same versions deliberately — two dependency
# sets that drift are worse than one duplicated list.
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "sqlmodel==0.0.24",
    "pydantic-settings==2.9.1",
    "PyYAML==6.0.3",
    "pycdlib==1.20.0",
    "argon2-cffi==23.1.0",
    "psutil==7.2.2",
    "httpx==0.28.1",
    "typer>=0.12,<1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

# The command name lives in exactly two places: here, and CLI_NAME in
# app/cli/naming.py. Renaming the product is those two lines.
[project.scripts]
iaas = "app.cli.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Platform markers exist so a run can say what it did *not* cover. A suite that
# silently skips the Windows half on Linux (or vice versa) reads as green when
# it is really partial — `pytest -m posix` and `-m windows` make the gap
# visible, and `--strict-markers` stops a typo from disabling a test quietly.
addopts = "--strict-markers"
markers = [
    "windows: requires a Windows host (Win32 APIs, path separators, ACLs)",
    "posix: requires a POSIX host (signals, sessions, file modes)",
    "posix_logic: POSIX decision logic, exercised anywhere by substituting syscalls",
]
