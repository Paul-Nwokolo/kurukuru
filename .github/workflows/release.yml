# Build the shipped installer on a machine that is not the author's.
#
# `verify.yml` proves the code is good. This proves the *artefact* is, and the
# distinction is not academic: every defect 0.1.2 fixed in the packaging — the
# unreachable bundled QEMU, `auth init` dying in the frozen build, an uninstall
# that left a PATH entry — was invisible to the test suite and visible the
# moment somebody ran the thing that ships.
#
# It is also the precondition for code signing. SignPath Foundation requires
# binaries to be "built from source code in a verifiable way", with provenance
# over the repository, branch and build agent; an installer assembled on a
# laptop from whatever QEMU happened to be installed on it is exactly what that
# rule exists to exclude. See docs/DECISIONS.md #62.
#
# Nothing here signs anything yet. When it does, the signing step goes between
# "build" and "upload" and nothing else changes.

name: release

on:
  push:
    tags: ["v*"]
  # So the artefact can be built and inspected without cutting a release —
  # which is how this workflow gets exercised between releases rather than
  # being first run on the day it matters.
  workflow_dispatch:
    inputs:
      upload_to_release:
        description: "Attach the installer to the release for this tag"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  installer:
    name: Windows installer
    runs-on: windows-latest
    outputs:
      name: ${{ steps.artefact.outputs.name }}
    # The QEMU download is ~200 MB and PyInstaller is not quick. Measured at
    # roughly 12 minutes locally; this is generous rather than tight, because
    # a release build timing out is worse than one that took a while.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Inno Setup
        # The compiler, not the IDE. `build_installer.py` discovers ISCC.exe in
        # the three places it can land, so nothing here needs to say where.
        run: choco install innosetup --no-progress --yes

      - name: Install the backend and its build tooling
        # `-e backend[build]` carries the pinned PyInstaller. The package
        # itself is installed, not just its requirements: PyInstaller freezes
        # what it can import.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "backend[build]"

      - name: Cache the pinned QEMU installer
        # ~200 MB from a single upstream mirror. Keyed on the pinned URL and
        # hash, which live in build_installer.py — so bumping the pin misses
        # the cache and re-downloads, which is the correct behaviour rather
        # than something to work around.
        id: qemu-cache
        uses: actions/cache@v4
        with:
          path: C:\kk-build\qemu-src\qemu-setup.exe
          key: qemu-${{ hashFiles('tools/build_installer.py') }}

      - name: Build the installer
        # --fetch-qemu verifies the installer's SHA-256 *before* executing it,
        # then installs it silently into the build root. No QEMU needs to be
        # on the runner, and the bundle cannot quietly become whatever version
        # a package manager decided to ship today.
        #
        # --build-root C:\kk-build for the 260-character budget: the default
        # workspace path plus PyInstaller's nesting goes over it.
        run: python tools/build_installer.py --build-root C:\kk-build --fetch-qemu

      - name: Record what was built
        id: artefact
        shell: pwsh
        run: |
          $exe = Get-ChildItem 'C:\kk-build\dist\Kurukuru-*-Setup.exe' | Select-Object -First 1
          if (-not $exe) { throw 'No installer was produced.' }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          # LF, written directly. Set-Content ends the line with CRLF, and
          # `sha256sum -c` then looks for a file whose name ends in a carriage
          # return: 0.1.3's and 0.1.4's published checksum files both failed
          # GNU coreutils 8.32's `sha256sum -c` while their hashes were right.
          # The `checksum` job below checks the real file on Linux.
          [IO.File]::WriteAllText("$($exe.FullName).sha256", "$hash  $($exe.Name)`n")
          "name=$($exe.Name)"      >> $env:GITHUB_OUTPUT
          "path=$($exe.FullName)"  >> $env:GITHUB_OUTPUT
          "sha256=$hash"           >> $env:GITHUB_OUTPUT
          Write-Host "$($exe.Name)  $([math]::Round($exe.Length/1MB,1)) MB  $hash"

      - name: Install it, and make it run
        # Not the staged tree — the actual installer, installed. Every
        # packaging defect 0.1.2 fixed was invisible until something ran what
        # ships: the bundled QEMU nothing pointed at, `auth init` dying in the
        # frozen build, an uninstall leaving a PATH entry behind.
        #
        # Every checkpoint is emitted as a workflow *annotation* rather than
        # only written to the log. Logs live in blob storage that is not
        # reachable from every network — it was not reachable from the
        # maintainer's while this workflow was being debugged — and a check
        # whose result cannot be read is not a check. Annotations come back
        # through the API that serves the run itself.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # PowerShell 7 turns a native command's non-zero exit into a
          # terminating error when ErrorActionPreference is Stop. Several
          # commands below are *supposed* to exit non-zero -- `auth init` with
          # no terminal refuses with exit 2, and that refusal is the thing
          # being asserted -- so exit codes are checked deliberately instead.
          $PSNativeCommandUseErrorActionPreference = $false

          function Note([string] $text) {
            Write-Host "::notice title=smoke::$text"
          }
          function Fail([string] $text) {
            Write-Host "::error title=smoke::$text"
            exit 1
          }

          $setup = '${{ steps.artefact.outputs.path }}'
          $dir   = 'C:\kk-app'

          $p = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList `
                 '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dir",'/TASKS='
          if ($p.ExitCode -ne 0) { Fail "the installer exited $($p.ExitCode)" }
          Note "installed to $dir"

          $exe = Join-Path $dir 'kurukuru.exe'
          if (-not (Test-Path $exe)) { Fail "nothing installed at $exe" }
          if (-not (Test-Path (Join-Path $dir 'qemu\qemu-system-x86_64.exe'))) {
            Fail 'the bundled QEMU is not beside the executable'
          }
          Note 'the bundled QEMU is beside the executable'

          $env:KURUKURU_STATE_DIR = 'C:\kk-smoke'
          $env:KURUKURU_PORT      = '7899'
          $env:KURUKURU_API_URL   = 'http://127.0.0.1:7899'

          $v = (& $exe version 2>&1 | Out-String).Trim() -replace "`r?`n", ' | '
          Note "version says: $v"

          # The check that would have caught `auth init`. With no account and
          # no terminal it must reach its password prompt and refuse *there*.
          # Before 0.1.2 it died earlier with a NameError, and the whole point
          # is the difference between the two.
          $raw = (& $exe auth init --username ci 2>&1 | Out-String).Trim()
          $out = $raw -replace "`r?`n", ' |'
          if ($out -match 'NameError') { Fail "auth init crashed before prompting: $out" }
          if ($out -notmatch 'password is required') {
            Fail "auth init did not reach its password prompt; it said: $out"
          }
          Note 'auth init reached its password prompt'

          # And the engine has to find the QEMU installed beside it -- the
          # 0.1.0 bug, which shipped because nothing ever ran the artefact.
          Start-Process -FilePath $exe -ArgumentList 'serve' -WindowStyle Hidden `
            -RedirectStandardOutput C:\kk-serve.log `
            -RedirectStandardError  C:\kk-serve.err | Out-Null

          $deadline = (Get-Date).AddSeconds(180)
          $health = $null
          while ((Get-Date) -lt $deadline) {
            try {
              $health = (Invoke-WebRequest 'http://127.0.0.1:7899/api/health' `
                          -UseBasicParsing -TimeoutSec 3).Content | ConvertFrom-Json
              break
            } catch { Start-Sleep -Milliseconds 500 }
          }

          if ($null -eq $health) {
            $log = ((Get-Content C:\kk-serve.log,C:\kk-serve.err -ErrorAction SilentlyContinue |
                     Select-Object -Last 15) -join ' | ')
            Fail "the backend never answered /health. Last output: $log"
          }
          if (-not $health.engine.available) {
            Fail ('the engine is unavailable, so the bundled QEMU was not resolved: ' +
                  ($health.engine | ConvertTo-Json -Compress))
          }
          Note "engine available -- qemu $($health.engine.version), accel $($health.engine.accel)"

          Get-Process -Name kurukuru -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2

          # Finally the uninstall path: remove the program, keep the data
          # (unattended never asks), and take the PATH entry with it.
          $before = [Environment]::GetEnvironmentVariable('Path','User')
          if ($before -notlike "*$dir*") { Fail 'the installer did not add its PATH entry' }
          $u = Start-Process -FilePath (Join-Path $dir 'unins000.exe') -Wait -PassThru `
                 -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          if ($u.ExitCode -ne 0) { Fail "the uninstaller exited $($u.ExitCode)" }
          Start-Sleep -Seconds 3
          if (Test-Path $exe) { Fail 'the program is still installed' }
          if (-not (Test-Path 'C:\kk-smoke')) { Fail 'an unattended uninstall removed the data' }
          $after = [Environment]::GetEnvironmentVariable('Path','User')
          if ($after -like "*$dir*") { Fail 'the uninstaller left its PATH entry behind' }
          Note 'uninstalled cleanly: program gone, data kept, PATH entry removed'

          # Say so explicitly. Several commands above exit non-zero by design
          # -- `auth init` refuses with 2, and that refusal is the assertion --
          # and $LASTEXITCODE survives to the end of the script, where the
          # runner reads it as the step's result. A script whose whole job is
          # assertions should state its own verdict rather than inherit one.
          exit 0

      - name: Upgrade over the previous release, and prove this build is what loads
        # The path a real user takes is an upgrade, not a clean install, and
        # until 0.1.4 that path was undefined: the installer copied over the
        # top and removed nothing, so 0.1.2 -> 0.1.4 left FastAPI 0.115.12's
        # metadata beside 0.120.4's. A security release whose fix depends on
        # which copy of a dependency loads cannot claim its version without
        # this (DECISIONS #66).
        #
        # Previous published release first, then the negative control: the
        # check must *fail* against it, or it is a check that passes anything.
        # Then this build over it, and the check must pass — every installed
        # file byte-identical to this build's stage with nothing extra, and
        # the installed exe reporting the pinned FastAPI and Starlette as the
        # modules it actually imported.
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          function Note([string] $text) { Write-Host "::notice title=upgrade::$text" }
          function Fail([string] $text) { Write-Host "::error title=upgrade::$text"; exit 1 }

          $setup = '${{ steps.artefact.outputs.path }}'
          $dir   = 'C:\kk-upgrade'
          $stage = 'C:\kk-build\stage'

          $prev = gh release list --exclude-drafts --exclude-pre-releases --limit 20 `
                    --json tagName --jq '.[].tagName' |
                  Where-Object { $_ -ne '${{ github.ref_name }}' } | Select-Object -First 1
          if (-not $prev) { Fail 'no previous published release to upgrade from' }
          gh release download $prev --pattern 'Kurukuru-*-Setup.exe*' --dir C:\kk-prev --clobber
          if ($LASTEXITCODE -ne 0) { Fail "could not download $prev" }
          $old = Get-ChildItem 'C:\kk-prev\Kurukuru-*-Setup.exe' | Select-Object -First 1
          $want = ((Get-Content "$($old.FullName).sha256") -split '\s+')[0].ToLower()
          $got  = (Get-FileHash $old.FullName -Algorithm SHA256).Hash.ToLower()
          if ($want -ne $got) { Fail "$prev's installer does not match its published checksum" }
          Note "previous release $prev, checksum verified ($got)"

          $p = Start-Process -FilePath $old.FullName -Wait -PassThru -ArgumentList `
                 '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dir",'/TASKS='
          if ($p.ExitCode -ne 0) { Fail "$prev's installer exited $($p.ExitCode)" }

          python tools/verify_upgrade.py --install-dir $dir --stage $stage --expect-fail
          if ($LASTEXITCODE -ne 0) { Fail "the upgrade check PASSED against $prev - it cannot tell builds apart" }
          Note "negative control: $prev fails the check, as it must"

          $p = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList `
                 '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dir",'/TASKS=',"/LOG=C:\kk-upgrade.log"
          if ($p.ExitCode -ne 0) { Fail "this build's installer exited $($p.ExitCode) over $prev" }

          python tools/verify_upgrade.py --install-dir $dir --stage $stage
          if ($LASTEXITCODE -ne 0) { Fail "after upgrading from $prev, the installed tree is not this build" }
          Note "upgraded over ${prev}: installed tree is this build byte for byte, and loads the pinned framework"

          $u = Start-Process -FilePath (Join-Path $dir 'unins000.exe') -Wait -PassThru `
                 -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          if ($u.ExitCode -ne 0) { Fail "the uninstaller exited $($u.ExitCode)" }
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artefact.outputs.name }}
          path: |
            C:\kk-build\dist\Kurukuru-*-Setup.exe
            C:\kk-build\dist\Kurukuru-*-Setup.exe.sha256
            C:\kk-build\stage\qemu\qemu-manifest.json
          if-no-files-found: error
          retention-days: 90

  checksum:
    # The checksum file is checked where the people who verify it are: on
    # Linux, with `sha256sum -c`. 0.1.3 and 0.1.4 both published a file ending
    # in CRLF, which GNU coreutils 8.32's `sha256sum -c` (Git for Windows', for
    # one) rejects as a missing file — reading as tampering to exactly the
    # careful user who bothered to run it. Attaching happens here, *after* the
    # check, so a file that does not verify is never published.
    #
    # The carriage-return check is the guard, not `sha256sum -c` alone:
    # measured on the deliberate-break run, this runner's newer coreutils
    # accepted the CRLF file ("OK") and only the explicit check failed it.
    name: checksum verifies on Linux, then attach
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      # Only the attach step needs more than read, and only on a tag.
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.installer.outputs.name }}
          path: artefact

      - name: sha256sum -c the published checksum file
        working-directory: artefact/dist
        run: |
          ls -l
          sha256sum --version | head -1
          sha256sum -c ./*.sha256
          # And no carriage return anywhere in it, said explicitly: the failure
          # above names a file that "does not exist", which is a confusing way
          # to learn the line ending is wrong.
          if grep -q $'\r' ./*.sha256; then
            echo "::error title=checksum::the checksum file contains a carriage return"
            exit 1
          fi

      - name: Attach to the release
        # Only for a tag, and only when asked. Publishing is still a human
        # act: this uploads to an existing release rather than creating one.
        if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.upload_to_release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        working-directory: artefact/dist
        run: |
          gh release upload "${{ github.ref_name }}" ./*-Setup.exe ./*-Setup.exe.sha256 --clobber

  pypi:
    # The first PyPI publish is planned for 0.1.5, by trusted publishing: no
    # token is stored anywhere, PyPI trusts this workflow's OIDC identity.
    #
    # GATED, and off until the maintainer turns it on. It runs only for a
    # pushed v* tag *and* when the repository variable PYPI_PUBLISHING is
    # "enabled" — which is set only after the PyPI account and the pending
    # publisher exist (docs/RELEASING.md, "PyPI"). Until then it is skipped.
    # tools/test_release_publishing.py fails if this gate is ever removed.
    #
    # Needs the Windows build and the checksum check to have passed first, so
    # a release that is broken elsewhere never reaches PyPI. Publishing there
    # cannot be undone — a version number, once uploaded, is spent forever.
    name: publish to PyPI (gated)
    needs: [installer, checksum]
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push' && vars.PYPI_PUBLISHING == 'enabled'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/kurukuru/
    permissions:
      contents: read
      id-token: write
    outputs:
      sha256: ${{ steps.wheel.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build the wheel, dashboard inside, contents checked
        run: |
          (cd frontend && npm ci)
          python -m pip install --upgrade pip setuptools
          python tools/build_wheel.py --out dist

      - name: The wheel is exactly this tag's version, and nothing else is uploaded
        id: wheel
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          wheel="dist/kurukuru-${version}-py3-none-any.whl"
          test -f "$wheel" || { echo "::error title=pypi::no $wheel for tag $GITHUB_REF_NAME"; exit 1; }
          test "$(ls dist | wc -l)" -eq 1 || { echo "::error title=pypi::dist/ holds more than the one wheel"; ls dist; exit 1; }
          echo "sha256=$(sha256sum "$wheel" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Publish (trusted publishing; no stored token)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  pypi-verify:
    # The release checklist's PyPI step, automated: what `pipx install
    # kurukuru` gives a stranger must be *our* package — the name, this
    # version, our repository — and its bytes must be the wheel just built.
    # Same standard as the anonymous download-and-hash of the installer.
    # INSTALL-LINUX may recommend `pipx install kurukuru` only after this has
    # passed for a release (docs/RELEASING.md).
    name: pipx install from PyPI is ours
    needs: pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install from PyPI into a clean pipx home, and check it
        env:
          BUILT_SHA256: ${{ needs.pypi.outputs.sha256 }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          export PIPX_HOME="$RUNNER_TEMP/pipx-home" PIPX_BIN_DIR="$RUNNER_TEMP/pipx-bin"
          # The index can lag the upload by a minute or two.
          for i in $(seq 1 30); do
            pip download --no-deps --no-cache-dir -q -d "$RUNNER_TEMP/dl" "kurukuru==$version" 2>/dev/null && break
            sleep 10
          done
          served="$(sha256sum "$RUNNER_TEMP/dl/kurukuru-${version}-py3-none-any.whl" | cut -d' ' -f1)"
          echo "built:  $BUILT_SHA256"
          echo "served: $served"
          test "$served" = "$BUILT_SHA256" || { echo "::error title=pypi::PyPI serves different bytes from the wheel this run built"; exit 1; }

          pipx install "kurukuru==$version"
          "$PIPX_HOME/venvs/kurukuru/bin/python" - "$version" <<'EOF'
          import importlib.metadata as md, sys
          meta = md.metadata("kurukuru")
          urls = meta.get_all("Project-URL") or []
          print("Name:", meta["Name"], "| Version:", meta["Version"])
          print("Project-URL:", urls)
          assert meta["Name"] == "kurukuru", meta["Name"]
          assert meta["Version"] == sys.argv[1], (meta["Version"], sys.argv[1])
          assert any(u.endswith("https://github.com/Paul-Nwokolo/kurukuru") for u in urls), urls
          EOF
          "$PIPX_BIN_DIR/kurukuru" version | grep -F "kurukuru  $version"
          echo "::notice title=pypi::pipx install kurukuru==$version is ours: name, version, repository and bytes all match"
