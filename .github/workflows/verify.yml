# Every gate this project has, run by something that is not the author's laptop.
#
# The reason this exists is worth stating, because the repository already had
# thorough checks and still shipped a broken console. `POST /console/ticket`
# answered 500 on every upgraded install for weeks; 961 tests passed throughout,
# because every test builds its database with `create_all` and therefore always
# has the current schema. The gap was not rigour, it was that the gates only
# ever ran one way, in one place, on one machine.
#
# So this runs on Windows: it is a Windows-first product, `fs_permissions` is
# ACL-based, and the path handling that produced the UNC containment bug behaves
# differently anywhere else. A Linux runner would be faster and would verify the
# wrong system.
#
# QEMU is installed rather than mocked. 53 tests fail without it — measured, not
# assumed — because they exercise `qemu-img` for real. Skipping them would make
# the run green while covering less, which is the failure mode CONTRIBUTING's
# "Verification integrity" section is entirely about.

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend + tools (Windows, real QEMU)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install QEMU
        # The 53 tests that shell out to qemu-img need a real binary.
        # Chocolatey is preinstalled on windows-latest.
        #
        # The install directory is discovered, not assumed. This step used to
        # append a hardcoded C:\Program Files\qemu to the PATH and trust it.
        # When the runner image moved QEMU somewhere else, choco still reported
        # success, the PATH entry pointed at nothing, and the failure surfaced
        # one step later as a bare "qemu-system-x86_64 is not recognized" —
        # with every backend test skipped and the run red for a reason that
        # looked nothing like its cause.
        #
        # So this step now proves what it claims: it locates both binaries and
        # runs them before putting anything on the PATH. An install step that
        # can report success while the thing it installed is unreachable is a
        # false green, which is what CONTRIBUTING's "Verification integrity"
        # section is about.
        run: |
          choco install qemu --no-progress --yes

          $roots = @(
            'C:\Program Files\qemu',
            "$env:ChocolateyInstall\lib\qemu\tools",
            'C:\ProgramData\chocolatey\lib\qemu\tools'
          ) | Where-Object { $_ -and (Test-Path $_) }

          $dir = $null
          foreach ($r in $roots) {
            if (Test-Path (Join-Path $r 'qemu-system-x86_64.exe')) { $dir = $r; break }
          }

          if (-not $dir) {
            # Bounded: the chocolatey package tree and Program Files, not all of C:.
            foreach ($base in @("$env:ChocolateyInstall\lib", 'C:\Program Files', 'C:\Program Files (x86)')) {
              if (-not (Test-Path $base)) { continue }
              $hit = Get-ChildItem -Path $base -Filter 'qemu-system-x86_64.exe' -Recurse -ErrorAction SilentlyContinue |
                     Select-Object -First 1
              if ($hit) { $dir = $hit.DirectoryName; break }
            }
          }

          if (-not $dir) {
            Write-Host "Looked in:"
            foreach ($r in $roots) { Write-Host "  $r" }
            throw "choco reported success but qemu-system-x86_64.exe was not found anywhere."
          }

          $img = Join-Path $dir 'qemu-img.exe'
          if (-not (Test-Path $img)) {
            throw "Found qemu-system-x86_64.exe in $dir but no qemu-img.exe beside it; the tests need both."
          }

          Write-Host "QEMU found in $dir"
          & (Join-Path $dir 'qemu-system-x86_64.exe') --version
          & $img --version
          $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Show the toolchain the run actually used
        # Printed rather than assumed: a version drift here is the difference
        # between "the tests pass" and "the tests pass against something else".
        run: |
          python --version
          qemu-system-x86_64 --version
          qemu-img --version

      - name: Install Python dependencies
        # `-e backend[dev]`, not `-r requirements.txt`. The tests import
        # `kurukuru`, and requirements installs the dependencies without
        # installing the package itself — locally that is invisible because the
        # venv has it editable-installed already. The `[dev]` extra carries the
        # pinned pytest, so nothing here resolves a version the pins did not
        # choose.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "backend[dev]"

      - name: Backend tests
        run: python -m pytest backend/tests -q

      - name: Tools tests
        run: python -m pytest tools -q

      - name: Defence tests fail when their defence is broken
        # A test that refuses something proves nothing until it has been seen
        # to fail with the refusal gone. Phase 17 deleted three defences one at
        # a time and the full suite stayed green for each (DECISIONS #65). This
        # applies every break in tools/prove_defences.py and fails the job if a
        # test named as proving it passes. Runs after the suites so a plain
        # regression reports as itself first.
        run: python tools/prove_defences.py

  backend-linux:
    # The suites on a genuinely non-Windows OS. This runner has no /dev/kvm,
    # and no test in the suite starts a VM anyway — so this job proves the
    # Python, the paths, the permissions and the POSIX process code on Linux,
    # and proves nothing about the hypervisor path. The last step says so in
    # the run itself, so the green tick cannot be read as more than it is.
    name: backend + tools (Linux, no KVM)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # qemu-img only, not the emulator: the image tests probe real qcow2
      # files, and without it they would skip — which report_skips below
      # would then fail, since they are on the must-run list.
      - name: Install qemu-img
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-utils
          qemu-img --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "backend[dev]"

      - name: Backend tests
        run: python -m pytest backend/tests -q -rs --junitxml=junit-backend.xml

      - name: What the backend run skipped, and what it must not have
        # Every skip printed as an annotation; the POSIX-only tests and the
        # qemu-img tests are the reason this job exists, so any of them
        # skipping — or no longer existing — fails it.
        if: always()
        run: >
          python tools/report_skips.py junit-backend.xml --must-run
          tests/test_fs_permissions.py::test_posix_hardening_sets_0600
          tests/test_keypairs.py::test_generated_private_keys_are_0600
          tests/test_process.py::test_spawned_child_leads_its_own_session
          tests/test_linux_host.py::test_on_a_real_posix_host_describe_answers_without_raising
          tests/test_state_migration.py::test_qcow2_backing_files_are_repointed
          tests/test_images_api.py::test_probe_reads_format_and_sizes

      - name: Tools tests
        run: python -m pytest tools -q -rs

      - name: Say what this job did not cover
        if: always()
        run: |
          echo "::notice title=no hypervisor::This runner has no /dev/kvm and no test starts a VM. Launch, boot, console, -cpu host, the display default and the reboot watchdog under KVM are unverified on Linux; see docs/PORTABILITY.md, Phase 18 open questions."

  wheel-linux:
    # The Linux install path, end to end short of a VM: build the wheel with
    # the dashboard inside it, install it with pipx into a fresh environment,
    # and run what was installed — not the checkout.
    name: wheel installs with pipx (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build the wheel
        run: |
          (cd frontend && npm ci)
          python -m pip install --upgrade pip setuptools
          python tools/build_wheel.py --out dist

      - name: Install it with pipx, and run the installed copy
        run: |
          set -eu
          pipx install dist/kurukuru-*.whl
          command -v kurukuru
          kurukuru version
          # No QEMU on this runner, deliberately: the backend must start and
          # doctor must name this distribution's package for it.
          test ! -e "$HOME/.kurukuru"

      - name: Serve from the wheel and check what it serves
        run: |
          set -eu
          kurukuru serve > serve.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:7842/api/health > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:7842/api/health
          # The dashboard comes out of the wheel, not a checkout.
          curl -sf http://127.0.0.1:7842/instances | grep -qi '<!doctype html>'
          grep -q "_dashboard" serve.log
          # State under XDG on a new Linux install, never ~/.kurukuru.
          test -d "$HOME/.local/share/kurukuru"
          test ! -e "$HOME/.kurukuru"
          # And the key directory and private key are owner-only.
          test "$(stat -c %a "$HOME/.local/share/kurukuru/keys")" = 700
          test "$(stat -c %a "$HOME/.local/share/kurukuru/keys/id_ed25519")" = 600

      - name: doctor on Linux gives Linux advice
        run: |
          set -u
          py="$(pipx environment --value PIPX_LOCAL_VENVS)/kurukuru/bin/python"
          # A throwaway owner account, created through the installed package the
          # way `auth init` does, with a password that never reaches a command line.
          "$py" - <<'EOF'
          import secrets
          from kurukuru.cli import auth_store, host_admin
          created = host_admin.create_owner("ci", secrets.token_urlsafe(18), "ci")
          auth_store.save(created.token, "")
          EOF
          # Actions runs bash with -e, and doctor is *meant* to exit 1 here (no
          # QEMU on this runner is a FAIL) -- so its status is captured, not
          # allowed to end the step before the checks below run. 3 would mean
          # the backend was unreachable, which is a different failure.
          set +e
          kurukuru doctor > doctor.txt; code=$?
          set -e
          echo "doctor exit: $code"
          cat doctor.txt
          test "$code" -eq 1
          grep -q "sudo apt install qemu-system-x86 qemu-utils" doctor.txt
          grep -q "KVM" doctor.txt
          if grep -qiE "windows|powershell|smart app|setx|\.exe|recycle bin" doctor.txt; then
            echo "::error title=doctor::Windows-shaped advice on Linux"; exit 1
          fi

      - name: The user service, as far as this runner allows
        # A CI runner usually has no systemd user manager for its account; the
        # real install, enable, restart and logout behaviour is checked in WSL2
        # (Phase 18). Here: the command must either work or refuse with its
        # explanation, never fail obscurely.
        run: |
          set +e
          kurukuru service install; code=$?
          echo "service install exit: $code"
          kurukuru service status
          test $code -eq 0 -o $code -eq 1

  frontend:
    name: frontend verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` rather than `npm install`: the lockfile is the input, and a run
      # that quietly resolves different versions is not verifying this commit.
      - name: Install
        working-directory: frontend
        run: npm ci

      # typecheck, lint, colour-token check, contrast across both themes, the
      # console handshake order, the product-name guard, the build, and the
      # no-hard-coded-origin check on the built bundle.
      - name: Verify
        working-directory: frontend
        run: npm run verify

  icons:
    name: icons match the artwork
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Pillow is deliberately not a project dependency — the icons are
      # committed build artefacts, regenerated only when the artwork changes.
      # It is installed here so `--check` can prove the committed files are
      # still what the coordinates produce.
      - name: Install Pillow
        run: python -m pip install Pillow

      - name: Icons are current
        run: python tools/make_icons.py --check
