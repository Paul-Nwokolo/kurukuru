# Every gate this project has, run by something that is not the author's laptop.
#
# The reason this exists is worth stating, because the repository already had
# thorough checks and still shipped a broken console. `POST /console/ticket`
# answered 500 on every upgraded install for weeks; 961 tests passed throughout,
# because every test builds its database with `create_all` and therefore always
# has the current schema. The gap was not rigour, it was that the gates only
# ever ran one way, in one place, on one machine.
#
# So this runs on Windows: it is a Windows-first product, `fs_permissions` is
# ACL-based, and the path handling that produced the UNC containment bug behaves
# differently anywhere else. A Linux runner would be faster and would verify the
# wrong system.
#
# QEMU is installed rather than mocked. 53 tests fail without it — measured, not
# assumed — because they exercise `qemu-img` for real. Skipping them would make
# the run green while covering less, which is the failure mode CONTRIBUTING's
# "Verification integrity" section is entirely about.

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend + tools (Windows, real QEMU)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install QEMU
        # The 53 tests that shell out to qemu-img need a real binary.
        # Chocolatey is preinstalled on windows-latest.
        #
        # The install directory is discovered, not assumed. This step used to
        # append a hardcoded C:\Program Files\qemu to the PATH and trust it.
        # When the runner image moved QEMU somewhere else, choco still reported
        # success, the PATH entry pointed at nothing, and the failure surfaced
        # one step later as a bare "qemu-system-x86_64 is not recognized" —
        # with every backend test skipped and the run red for a reason that
        # looked nothing like its cause.
        #
        # So this step now proves what it claims: it locates both binaries and
        # runs them before putting anything on the PATH. An install step that
        # can report success while the thing it installed is unreachable is a
        # false green, which is what CONTRIBUTING's "Verification integrity"
        # section is about.
        run: |
          choco install qemu --no-progress --yes

          $roots = @(
            'C:\Program Files\qemu',
            "$env:ChocolateyInstall\lib\qemu\tools",
            'C:\ProgramData\chocolatey\lib\qemu\tools'
          ) | Where-Object { $_ -and (Test-Path $_) }

          $dir = $null
          foreach ($r in $roots) {
            if (Test-Path (Join-Path $r 'qemu-system-x86_64.exe')) { $dir = $r; break }
          }

          if (-not $dir) {
            # Bounded: the chocolatey package tree and Program Files, not all of C:.
            foreach ($base in @("$env:ChocolateyInstall\lib", 'C:\Program Files', 'C:\Program Files (x86)')) {
              if (-not (Test-Path $base)) { continue }
              $hit = Get-ChildItem -Path $base -Filter 'qemu-system-x86_64.exe' -Recurse -ErrorAction SilentlyContinue |
                     Select-Object -First 1
              if ($hit) { $dir = $hit.DirectoryName; break }
            }
          }

          if (-not $dir) {
            Write-Host "Looked in:"
            foreach ($r in $roots) { Write-Host "  $r" }
            throw "choco reported success but qemu-system-x86_64.exe was not found anywhere."
          }

          $img = Join-Path $dir 'qemu-img.exe'
          if (-not (Test-Path $img)) {
            throw "Found qemu-system-x86_64.exe in $dir but no qemu-img.exe beside it; the tests need both."
          }

          Write-Host "QEMU found in $dir"
          & (Join-Path $dir 'qemu-system-x86_64.exe') --version
          & $img --version
          $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Show the toolchain the run actually used
        # Printed rather than assumed: a version drift here is the difference
        # between "the tests pass" and "the tests pass against something else".
        run: |
          python --version
          qemu-system-x86_64 --version
          qemu-img --version

      - name: Install Python dependencies
        # `-e backend[dev]`, not `-r requirements.txt`. The tests import
        # `kurukuru`, and requirements installs the dependencies without
        # installing the package itself — locally that is invisible because the
        # venv has it editable-installed already. The `[dev]` extra carries the
        # pinned pytest, so nothing here resolves a version the pins did not
        # choose.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "backend[dev]"

      - name: Backend tests
        run: python -m pytest backend/tests -q

      - name: Tools tests
        run: python -m pytest tools -q

  frontend:
    name: frontend verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` rather than `npm install`: the lockfile is the input, and a run
      # that quietly resolves different versions is not verifying this commit.
      - name: Install
        working-directory: frontend
        run: npm ci

      # typecheck, lint, colour-token check, contrast across both themes, the
      # console handshake order, the product-name guard, the build, and the
      # no-hard-coded-origin check on the built bundle.
      - name: Verify
        working-directory: frontend
        run: npm run verify

  icons:
    name: icons match the artwork
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Pillow is deliberately not a project dependency — the icons are
      # committed build artefacts, regenerated only when the artwork changes.
      # It is installed here so `--check` can prove the committed files are
      # still what the coordinates produce.
      - name: Install Pillow
        run: python -m pip install Pillow

      - name: Icons are current
        run: python tools/make_icons.py --check
